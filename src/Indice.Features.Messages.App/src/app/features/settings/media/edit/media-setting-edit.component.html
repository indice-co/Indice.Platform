<lib-side-view-layout [title]="'Settings.EditMediaSettingDialogTitle' | translate"
                      [ok-close-dialog]="false"
                      [ok-label]="'Settings.Save' | translate"
                      [cancel-label]="'Settings.Close' | translate"
                      (ok)="submitButton.nativeElement.click()"
                      [disabled]="!mediaSettingForm.valid || submitInProgress"
                      #sideViewLayout>
    <div class="mt-4">
        <form #mediaSettingForm="ngForm"
              (ngSubmit)="onSubmit()">
            <div class="px-4 space-y-2 pb-4">
                <div class="grid grid-cols-4 gap-1">
                    <!-- Τιμή -->
                    <div class="col-span-4">
                        <label for="settingValue"
                               class="field-label">
                            {{ 'Settings.SettingValueLabelRequired' | translate }}
                        </label>
                        <div class="flex rounded-sm">
                            <input class="w-full"
                                   type="text"
                                   name="settingValue"
                                   id="settingValue"
                                   [(ngModel)]="model.value"
                                   placeholder="{{ 'Settings.SettingValuePlaceholder' | translate }}"
                                   pattern="^((http|https):\/\/.)[-a-zA-Z0-9@:%._\+~#=]{2,256}\.[a-z]{2,6}\b([-a-zA-Z0-9@:%_\+.~#?&//=]*)$"
                                   #settingValue="ngModel">
                        </div>
                        @if (settingValue.invalid && (settingValue.dirty || settingValue.touched)) {
                          <p
                           class="mt-2 text-sm text-red-600">
                            @if (settingValue.errors!['pattern']) {
                              <span>{{ 'Settings.SettingValuePatternError' | translate }}</span>
                            }
                          </p>
                        }
                        <p class="field-info col-span-3">{{ 'Settings.SettingValueInfo' | translate }}</p>
                    </div>
                </div>
                
            </div>
            <button type="submit"
                    [style.visibility]="'hidden'"
                    #submitBtn>
                Submit
            </button>
        </form>
    </div>
</lib-side-view-layout>
