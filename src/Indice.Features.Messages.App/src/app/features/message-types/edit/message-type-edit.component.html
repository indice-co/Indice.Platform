<lib-side-view-layout [title]="'MessageTypes.EditDialogTitle' | translate"
                      [ok-close-dialog]="false"
                      [ok-label]="'MessageTypes.Save' | translate"
                      [cancel-label]="'MessageTypes.Close' | translate"
                      (ok)="submitButton.nativeElement.click()"
                      [disabled]="!messageTypeForm.valid || submitInProgress"
                      #sideViewLayout>
  <div class="mt-4">
    <form #messageTypeForm="ngForm" (ngSubmit)="onSubmit()">
      <div class="px-4 space-y-2 pb-4">
        <div class="grid grid-cols-4 gap-1">

          <!-- Name -->
          <div class="col-span-4">
            <label for="messageTypeName" class="field-label">
              {{ 'MessageTypes.NameLabelRequired' | translate }}
            </label>
            <div class="flex rounded-sm">
              <input class="w-full"
                     type="text"
                     name="messageTypeName"
                     id="messageTypeName"
                     [(ngModel)]="model.name"
                     [placeholder]="'MessageTypes.NamePlaceholder' | translate"
                     maxlength="128"
                     required
                     #messageTypeName="ngModel">
            </div>
            <p *ngIf="messageTypeName.invalid && (messageTypeName.dirty || messageTypeName.touched)"
               class="mt-2 text-sm text-red-600">
              <span *ngIf="messageTypeName.errors?.['required']">{{ 'MessageTypes.NameRequiredError' | translate }}</span>
              <span *ngIf="messageTypeName.errors?.['maxlength']">{{ 'MessageTypes.NameMaxLengthError' | translate }}</span>
            </p>
            <p class="field-info col-span-3">
              {{ 'MessageTypes.NameInfo' | translate }}
            </p>
          </div>

          <!-- Alias -->
          <div class="col-span-4">
            <label for="messageTypeAlias" class="field-label">
              {{ 'MessageTypes.AliasLabel' | translate }}
            </label>
            <div class="flex rounded-sm">
              <input class="w-full"
                     type="text"
                     name="messageTypeAlias"
                     id="messageTypeAlias"
                     [(ngModel)]="model.alias"
                     [placeholder]="'MessageTypes.AliasPlaceholder' | translate"
                     maxlength="64"
                     #messageTypeAlias="ngModel">
            </div>
            <p *ngIf="messageTypeAlias.invalid && (messageTypeAlias.dirty || messageTypeAlias.touched)"
               class="mt-2 text-sm text-red-600">
              <span *ngIf="messageTypeAlias.errors?.['maxlength']">{{ 'MessageTypes.AliasMaxLengthError' | translate }}</span>
            </p>
          </div>

          <!-- Classification -->
          <div class="col-span-4">
            <label for="classificationType" class="field-label">
              {{ 'MessageTypes.ClassificationLabel' | translate }}
              <span class="dot dot-{{model.classification}}"></span>
            </label>
            <select id="classificationType"
                    name="classificationType"
                    [(ngModel)]="model.classification"
                    class="w-full"
                    required
                    #classificationType="ngModel">
              <option *ngFor="let option of classifications" [value]="option">{{ option }}</option>
            </select>
            <p *ngIf="classificationType.invalid && (classificationType.dirty || classificationType.touched)"
               class="mt-2 text-sm text-red-600">
              <span *ngIf="classificationType.errors?.['required']">{{ 'MessageTypes.ClassificationRequiredError' | translate }}</span>
            </p>
          </div>

        </div>
      </div>
      <button type="submit" [style.visibility]="'hidden'" #submitBtn>Submit</button>
    </form>
  </div>
</lib-side-view-layout>
