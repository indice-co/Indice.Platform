<lib-view-layout [title]="'Campaigns.Title' | translate"
                 [busy]="!items"
                 [actions]="actions"
                 [meta-items]="metaItems"
                 (onAction)="actionHandler($event)"
                 (onSearch)="searchChanged($event)">
  <lib-list-view [items]="items"
                 [page]="page"
                 [page-size]="pageSize"
                 [count]="count"
                 [sort-options]="sortOptions"
                 [sort]="sort"
                 [sort-dir]="sortdir"
                 [busy]="!items"
                 (pageChanged)="pageChanged($event)"
                 (pageSizeChanged)="pageSizeChanged($event)"
                 (sortChanged)="sortChanged($event)"
                 (sortdirChanged)="sortdirChanged($event)">

    <ng-container pager-near-content>
      <div class="inline-flex">
        <lib-toggle-buttons-list class="mr-2"
                                 [icon]="'ms-Icon ms-Icon--Filter text-gray-300'"
                                 [options]="messageTypeOptions$ | async"
                                 (value)="messageTypeFilter"
                                 (valueChange)="onFilterChanged('messageType', $event)">
        </lib-toggle-buttons-list>
      </div>
    </ng-container>

    <lib-list-column [title]="'Campaigns.ItemTitle' | translate">
      <ng-template let-item>
        <a [title]="'Campaigns.Details' | translate"
           [routerLink]="[item.id]"
           class="text-blue-600">
          {{ item.title }}
        </a>
      </ng-template>
    </lib-list-column>

    <lib-list-column [title]="'Campaigns.Channels' | translate">
      <ng-template let-item>
        <div class="flex items-center space-x-1" [title]="item.messageChannelKind?.join(', ')">
          <span [ngClass]="{ 'text-green-500': item.messageChannelKind.includes('Email') }" class="ml-1 text-gray-400">
            <i class="ms-Icon ms-Icon--Accounts"></i>
          </span>
          <span [ngClass]="{ 'text-green-500': item.messageChannelKind.includes('SMS') }" class="ml-1 text-gray-400">
            <i class="ms-Icon ms-Icon--Chat"></i>
          </span>
          <span [ngClass]="{ 'text-green-500': item.messageChannelKind.includes('Inbox') }" class="ml-1 text-gray-400">
            <i class="ms-Icon ms-Icon--Inbox"></i>
          </span>
          <span [ngClass]="{ 'text-green-500': item.messageChannelKind.includes('PushNotification') }" class="ml-1 text-gray-400">
            <i class="ms-Icon ms-Icon--CellPhone"></i>
          </span>
        </div>
      </ng-template>
    </lib-list-column>

    <lib-list-column [title]="'Campaigns.Type' | translate">
      <ng-template let-item>
        <span *ngIf="item.type"
              [title]="item.type?.classification"
              class="message-type-badge {{item.type?.classification}}">
          {{ item.type?.name || '-' }}
        </span>
      </ng-template>
    </lib-list-column>

    <lib-list-column [title]="'Campaigns.From' | translate">
      <ng-template let-item>{{ item.activePeriod?.from ? (item.activePeriod.from | date:'medium') : '-' }}</ng-template>
    </lib-list-column>

    <lib-list-column [title]="'Campaigns.To' | translate">
      <ng-template let-item>{{ item.activePeriod?.to ? (item.activePeriod.to | date:'medium') : '-' }}</ng-template>
    </lib-list-column>

    <lib-list-column [title]="'Campaigns.CreatedBy' | translate">
      <ng-template let-item>{{ item.createdBy }}</ng-template>
    </lib-list-column>

    <lib-list-column [title]="'Campaigns.CreatedAt' | translate">
      <ng-template let-item>{{ item.createdAt | date:'medium' }}</ng-template>
    </lib-list-column>

    <!-- Optional uncomment if needed
    <lib-list-column [title]="'Campaigns.UpdatedBy' | translate">
      <ng-template let-item>{{ item.updatedBy || '-' }}</ng-template>
    </lib-list-column>
    <lib-list-column [title]="'Campaigns.UpdatedAt' | translate">
      <ng-template let-item>{{ item.updatedAt ? (item.updatedAt | date:'medium') : '-' }}</ng-template>
    </lib-list-column>
    -->

    <lib-list-column [title]="'Campaigns.Published' | translate" [full-width]="true">
      <ng-template let-item>
        <span [innerHtml]="item.published | beautifyBoolean"></span>
      </ng-template>
    </lib-list-column>

  </lib-list-view>
</lib-view-layout>
