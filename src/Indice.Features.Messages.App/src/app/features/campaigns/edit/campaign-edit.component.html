<lib-view-layout [meta-items]="metaItems"
                 title="Φόρτωση δεδομένων"
                 #layout>
    <div class="min-h-full">
        <main>
            <div class="mb-8 mx-auto grid gap-6 lg:grid-flow-col-dense grid-cols-1 lg:grid-cols-6">
                <section aria-labelledby="timeline-title"
                         class="lg:col-start-1 lg:col-span-1">
                    <div class="bg-white px-4 py-5 shadow sm:rounded-lg sm:px-6">
                        <nav class="space-y-1"
                             aria-label="Sidebar">
                            <a [routerLink]="['campaign-details']"
                               class="vertical-navigation-link-base"
                                routerLinkActive="vertical-navigation-link-active"
                               [routerLinkActiveOptions]="{ exact: true }"
                               aria-current="page">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                     class="text-gray-500 flex-shrink-0 -ml-1 mr-3 h-6 w-6"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke="currentColor"
                                     stroke-width="2">
                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                        d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <span class="truncate">Βασικές πληροφορίες</span>
                            </a>
                            <a [routerLink]="['campaign-content']"
                               routerLinkActive="vertical-navigation-link-active"
                               [routerLinkActiveOptions]="{ exact: true }"
                               class="vertical-navigation-link-base">
                                <svg xmlns="http://www.w3.org/2000/svg"
                                     class="text-gray-400 flex-shrink-0 -ml-1 mr-3 h-6 w-6"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke="currentColor"
                                     stroke-width="2">
                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                        d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM4 13a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zM16 13a1 1 0 011-1h2a1 1 0 011 1v6a1 1 0 01-1 1h-2a1 1 0 01-1-1v-6z" />
                                </svg>
                                <span class="truncate">Περιεχόμενο</span>
                            </a>
                            <a [routerLink]="['campaign-reports']"
                               routerLinkActive="vertical-navigation-link-active"
                               [routerLinkActiveOptions]="{ exact: true }"
                               class="vertical-navigation-link-base">
                                <svg class="text-gray-400 flex-shrink-0 -ml-1 mr-3 h-6 w-6"
                                     xmlns="http://www.w3.org/2000/svg"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke-width="2"
                                     stroke="currentColor"
                                     aria-hidden="true">
                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                                </svg>
                                <span class="truncate">Αναφορές</span>
                            </a>
                            <a [routerLink]="['campaign-messages']"
                               routerLinkActive="vertical-navigation-link-active"
                                [routerLinkActiveOptions]="{ exact: true }"
                               class="vertical-navigation-link-base">
                                <svg class="text-gray-400 flex-shrink-0 -ml-1 mr-3 h-6 w-6"
                                    xmlns="http://www.w3.org/2000/svg" 
                                    fill="currentColor"
                                     viewBox="0 0 16 16">
                                    <path
                                        d="M8.515 1.019A7 7 0 0 0 8 1V0a8 8 0 0 1 .589.022zm2.004.45a7 7 0 0 0-.985-.299l.219-.976q.576.129 1.126.342zm1.37.71a7 7 0 0 0-.439-.27l.493-.87a8 8 0 0 1 .979.654l-.615.789a7 7 0 0 0-.418-.302zm1.834 1.79a7 7 0 0 0-.653-.796l.724-.69q.406.429.747.91zm.744 1.352a7 7 0 0 0-.214-.468l.893-.45a8 8 0 0 1 .45 1.088l-.95.313a7 7 0 0 0-.179-.483m.53 2.507a7 7 0 0 0-.1-1.025l.985-.17q.1.58.116 1.17zm-.131 1.538q.05-.254.081-.51l.993.123a8 8 0 0 1-.23 1.155l-.964-.267q.069-.247.12-.501m-.952 2.379q.276-.436.486-.908l.914.405q-.24.54-.555 1.038zm-.964 1.205q.183-.183.35-.378l.758.653a8 8 0 0 1-.401.432z" />
                                    <path d="M8 1a7 7 0 1 0 4.95 11.95l.707.707A8.001 8.001 0 1 1 8 0z" />
                                    <path
                                        d="M7.5 3a.5.5 0 0 1 .5.5v5.21l3.248 1.856a.5.5 0 0 1-.496.868l-3.5-2A.5.5 0 0 1 7 9V3.5a.5.5 0 0 1 .5-.5" />
                                </svg>
                                <span class="truncate">Ιστορικό</span>
                            </a>
                        </nav>
                    </div>
                </section>
                <div class="space-y-6 lg:col-start-2 lg:col-span-5">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </main>
    </div>
</lib-view-layout>
