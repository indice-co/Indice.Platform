<section aria-labelledby="applicant-information-title">
  <div class="bg-white shadow sm:rounded-lg">
    <div class="px-4 py-5 sm:px-6">
      <h2 id="applicant-information-title" class="text-lg leading-6 font-medium text-gray-900">
        Αναφορές
      </h2>
      <p class="mt-1 mb-1 max-w-2xl text-sm text-gray-500">Διαγράμματα που αφορούν την καμπάνια.</p>

      <dl class="mt-5 grid grid-cols-1 divide-gray-200 overflow-hidden rounded-lg bg-white shadow-sm md:grid-cols-3 md:divide-x md:divide-y-0 dark:divide-white/10 dark:bg-gray-800/75 dark:shadow-none dark:inset-ring dark:inset-ring-white/10">
        <div class="px-4 py-5 sm:p-6">

          <dt class="text-base font-normal text-gray-900 dark:text-gray-100">
            Total recipient reach
          </dt>
          <dd class="mt-1 flex items-baseline justify-between md:block lg:flex">
            <div class="flex items-baseline text-2xl font-semibold text-indigo-600 dark:text-indigo-400">
              {{ counters?.recipient?.reached || 0 }}
              <span class="ml-2 text-sm font-medium text-gray-500 dark:text-gray-400">out of <span class="text-gray-700">{{counters?.recipient?.total}}</span> total</span>
            </div>

            <div title="Avg Reachability" class="inline-flex items-baseline rounded-full bg-green-100 px-2.5 py-0.5 text-sm font-medium text-green-800 md:mt-2 lg:mt-0 dark:bg-green-400/10 dark:text-green-400">

              <span class="sr-only"> Avg Reachability </span>
              {{ counters?.recipient?.coverage | percent:'1.0-1' }}
            </div>
          </dd>
        </div>
      </dl>
      <div class="cards-deck-2 mt-8">
        <div class="card">
          <div class="card-body" style="position:relative">
            <h4 class="mt-0 header-title mb-4">
              <span>
                Total messages sent
              </span>
              <span class="flex items-baseline text-2xl font-semibold text-indigo-600 dark:text-indigo-400">
                {{ counters?.recipient?.totalMessages }}
              </span>
            </h4>
            <app-gauge-chart [items]="gaugeChannels" style="max-height:200px"></app-gauge-chart>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
