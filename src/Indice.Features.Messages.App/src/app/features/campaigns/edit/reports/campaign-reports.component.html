<section aria-labelledby="applicant-information-title">
  <div class="bg-white shadow sm:rounded-lg">
    <div class="px-4 py-5 sm:px-6">
      <h2 id="applicant-information-title"
          class="text-lg leading-6 font-medium text-gray-900">
        Αναφορές
      </h2>
      <p class="mt-1 max-w-2xl text-sm text-gray-500">Διαγράμματα που αφορούν την καμπάνια.</p>

      <div class="cards-deck-4">
        <lib-kpi-tile title="Αναγνωσμένα" [busy]="!loaded" [kpi]="counters?.readCount" ></lib-kpi-tile>
        <lib-kpi-tile title="Μη Αναγνωσμένα" [busy]="!loaded" [kpi]="counters?.notReadCount" ></lib-kpi-tile>
        <lib-kpi-tile title="Διαγραμένα" [busy]="!loaded" [kpi]="counters?.deletedCount" ></lib-kpi-tile>
        <lib-kpi-tile title="Call to Atcion" [busy]="!loaded" [kpi]="counters?.callToActionCount"></lib-kpi-tile>
<app-doughnut-chart  [stringValue]="counters?.readCount ?? ''" [title]="('hotness-score')"
  [type]="1"></app-doughnut-chart>
<app-doughnut-chart [stringValue]="counters?.callToActionCount?? ''" [title]="('liquidity-score')"
  [type]="0"></app-doughnut-chart>
        <ng-container *ngIf="counters?.messagesperChannel">
          <lib-kpi-tile *ngFor="let entry of counters?.messagesperChannel | keyvalue"
                        [title]="entry.key"
                        [busy]="!loaded"
                        [kpi]="entry.value">
          </lib-kpi-tile>
        </ng-container>

      </div>
    </div>
  </div>
</section>
