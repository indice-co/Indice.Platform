<lib-side-view-layout title="{{ 'DistributionLists.SearchTitle' | translate }}"
                      [ok-close-dialog]="false"
                      [ok-label]="'DistributionLists.Add' | translate"
                      [cancel-label]="'DistributionLists.CancelLabel' | translate"
                      (ok)="distributionListContactCreateComponent.submit()"
                      [disabled]="submitInProgress"
                      #sideViewLayout>
  <div class="mt-4">
    <app-list-contact-create #distributionListContactCreateComponent (onSubmit)="onSubmit($event)"></app-list-contact-create>
  </div>
</lib-side-view-layout>
