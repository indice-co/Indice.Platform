<lib-side-view-layout title="{{ 'DistributionLists.ImportContactsTitle' | translate }}"
                      [ok-close-dialog]="false"
                      [ok-label]="'DistributionLists.ImportContacts' | translate"
                      [cancel-label]="'DistributionLists.CancelLabel' | translate"
                      (ok)="submitButton.nativeElement.click()"
                      [disabled]="!distributionListForm.valid || submitInProgress"
                      #sideViewLayout>
    <div class="mt-4">
        <form #distributionListForm="ngForm"
              (ngSubmit)="onSubmit()">
            <div class="px-4 space-y-2 pb-4">
              <div class="grid grid-cols-4 gap-4">
                <!-- CSV file upload option -->
                <div class="col-span-4">
                  <label for="distributionListAttachment"
                         class="field-label">
                    {{ 'DistributionLists.ImportContactsLabel' | translate }}
                  </label>
                  <div class="mt-5">
                    <app-file-upload #fileUploadComponent
                                     [extendedView]="true"
                                     [maxSize]="6*1024*1024"
                                     (fileChange)="onFileChange($event)">
                    </app-file-upload>
                  </div>
                </div>
              </div>
            </div>
            <button type="submit"
                    [style.visibility]="'hidden'"
                    #submitBtn>
                {{ 'DistributionLists.Submit' | translate }}
            </button>
        </form>
    </div>
</lib-side-view-layout>
