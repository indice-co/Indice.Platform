<lib-side-view-layout title="Μαζική εισαγωγή επαφών"
                      [ok-close-dialog]="false"
                      [ok-label]="'Μαζική εισαγωγή'"
                      [cancel-label]="'Κλείσιμο'"
                      (ok)="submitButton.nativeElement.click()"
                      [disabled]="!distributionListForm.valid || submitInProgress"
                      #sideViewLayout>
    <div class="mt-4">
        <form #distributionListForm="ngForm"
              (ngSubmit)="onSubmit()">
            <div class="px-4 space-y-2 pb-4">
                <div class="grid grid-cols-4 gap-4">
                    <!-- CSV file upload option -->
                     <div class="col-span-4">
                        <label for="distributionListAttachment"
                            class="field-label">
                            Μαζική εισαγωγή επαφών στην λίστα διανομής από αρχείο CSV (*)
                        </label>
                        <div class="mt-5">
                            <app-file-upload 
                                #fileUploadComponent 
                                [extendedView]="true" 
                                [maxSize]="6*1024*1024" 
                                (fileChange)="onFileChange($event)">
                            </app-file-upload>
                        </div>
                     </div>
                </div>
            </div>
            <button type="submit"
                    [style.visibility]="'hidden'"
                    #submitBtn>
                Submit
            </button>
        </form>
    </div>
</lib-side-view-layout>
