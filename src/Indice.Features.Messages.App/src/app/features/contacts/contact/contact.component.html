<lib-view-layout [meta-items]="metaItems"
                 [title]="'Επαφή'"
                 #layout>
    <div class="min-h-full">
        <main>
            <div class="mb-8 mx-auto grid gap-6 lg:grid-flow-col-dense grid-cols-1 lg:grid-cols-6">
                <section aria-labelledby="timeline-title"
                         class="lg:col-start-1 lg:col-span-1">
                    <div class="bg-white px-4 py-5 shadow sm:rounded-lg sm:px-6">
                      <nav class="space-y-1"
                           aria-label="Sidebar">
                        <a [routerLink]="['contact-details']"
                           routerLinkActive="vertical-navigation-link-active"
                           class="vertical-navigation-link-base"
                           aria-current="page">
                          <svg xmlns="http://www.w3.org/2000/svg"
                               class="text-gray-500 flex-shrink-0 -ml-1 mr-3 h-6 w-6"
                               fill="none"
                               viewBox="0 0 24 24"
                               stroke="currentColor"
                               stroke-width="2">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                          <span class="truncate">Βασικές πληροφορίες</span>
                        </a>
                        <a [routerLink]="['contact-campaigns']"
                           routerLinkActive="vertical-navigation-link-active"
                           class="vertical-navigation-link-base"
                           aria-current="page">
                          <svg class="text-gray-500 flex-shrink-0 -ml-1 mr-3 h-6 w-6"
                               fill="none"
                               viewBox="0 0 24 24"
                               stroke="currentColor"
                               stroke-width="2">
                            <path d="M9 6a3 3 0 11-6 0 3 3 0 016 0zM17 6a3 3 0 11-6 0 3 3 0 016 0zM12.93 17c.046-.327.07-.66.07-1a6.97 6.97 0 00-1.5-4.33A5 5 0 0119 16v1h-6.07zM6 11a5 5 0 015 5v1H1v-1a5 5 0 015-5z" />
                          </svg>
                          <span class="truncate">Καμπάνιες</span>
                        </a>
                        <a *ngIf="Contact?.recipientId"
                           [routerLink]="['contact-preferences']"
                           routerLinkActive="vertical-navigation-link-active"
                           class="vertical-navigation-link-base"
                           aria-current="page">
                          <svg class="text-gray-500 flex-shrink-0 -ml-1 mr-3 h-6 w-6"
                               fill="none"
                               viewBox="0 0 24 24"
                               stroke="currentColor"
                               stroke-width="2">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7.75 4H19M7.75 4a2.25 2.25 0 0 1-4.5 0m4.5 0a2.25 2.25 0 0 0-4.5 0M1 4h2.25m13.5 6H19m-2.25 0a2.25 2.25 0 0 1-4.5 0m4.5 0a2.25 2.25 0 0 0-4.5 0M1 10h11.25m-4.5 6H19M7.75 16a2.25 2.25 0 0 1-4.5 0m4.5 0a2.25 2.25 0 0 0-4.5 0M1 16h2.25"></path>
                          </svg>
                          <span class="truncate">Ρυθμίσεις επικοινωνίας</span>
                        </a>
                      </nav>
                    </div>
                </section>
                <div class="space-y-6 lg:col-start-2 lg:col-span-5">
                    <router-outlet></router-outlet>
                </div>
            </div>
        </main>
    </div>
</lib-view-layout>
