<!doctype html>
<html lang="%(Lang)" data-theme="cases">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui" />
    <title>%(DocumentTitle)</title>
    <base href="%(Path)/" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="%(Path)/favicon.svg" />
    <style>html{background:#eef1f6}@media (prefers-color-scheme: dark){html{background:#10172a}}</style>
    <link rel="stylesheet" href="%(Path)/styles.css?v=%(ProductVersion)" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="%(Path)/styles.css?v=%(ProductVersion)"></noscript>
    %(HeadContent)
</head>
<body>
    <app-root host="%(Host)"
              authority="%(Authority)"
              clientId="%(ClientId)"
              baseHref="%(Path)"
              culture="%(Culture)"
              version="%(ProductVersion)"
              scopes="%(Scopes)"
              apiUrl="%(ApiBase)"
              i18nAssets="%(I18nAssets)"
              dashboardTags="%(DashboardTags)"
              caseListColumns="%(CaseListColumns)"
              caseListFilters="%(CaseListFilters)">
    </app-root>
    <link rel="modulepreload" href="%(Path)/chunk-*.js">
    <script src="%(Path)/polyfills.js?v=%(ProductVersion)" type="module"></script>
    <script src="%(Path)/main.js?v=%(ProductVersion)" type="module"></script>
</body>
</html>
