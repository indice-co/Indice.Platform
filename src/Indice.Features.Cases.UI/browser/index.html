<!doctype html>
<html lang="%(Lang)">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>%(DocumentTitle)</title>
    <base href="%(Path)/" />
    <link rel="icon" type="image/svg+xml" href="%(Path)/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="%(Path)/favicon.ico" />
    <!-- Paint the frame colour of the remembered (or OS) theme before the stylesheet arrives. -->
    <script>try { var t = localStorage.getItem('cases-ui.theme'); if (t) document.documentElement.setAttribute('data-theme', t === 'dark' ? 'cases-dark' : 'cases'); } catch (e) { }</script>
    <style>html{background:#ebf0ee;color:#141a19}@media (prefers-color-scheme:dark){html:not([data-theme]){background:#0d1110;color:#e8eeec}}html[data-theme=cases-dark]{background:#0d1110;color:#e8eeec}body{margin:0}</style>
    <link rel="stylesheet" href="%(Path)/styles-*.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="%(Path)/styles-*.css"></noscript>
    %(HeadContent)
</head>
<body>
    <app-root host="%(Host)"
              authority="%(Authority)"
              clientId="%(ClientId)"
              baseHref="%(Path)"
              culture="%(Culture)"
              version="%(ProductVersion)"
              scopes="%(Scopes)"
              apiUrl="%(ApiBase)"
              i18nAssets="%(I18nAssets)"
              dashboardTags="%(DashboardTags)"
              caseListColumns="%(CaseListColumns)"
              caseListFilters="%(CaseListFilters)">
    </app-root>
    <!-- Content-hashed names, expanded by the middleware. No query string: lazy chunks import ./main-<hash>.js, and a
         different URL would run main a second time. -->
    <link rel="modulepreload" href="%(Path)/chunk-*.js">
    <script src="%(Path)/polyfills-*.js" type="module"></script>
    <script src="%(Path)/main-*.js" type="module"></script>
</body>
</html>
