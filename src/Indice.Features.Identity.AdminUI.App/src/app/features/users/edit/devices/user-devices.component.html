<swal title="Delete?" text="User device will be deleted permanently. This action cannot be reversed." type="warning" [showCancelButton]="true" (confirm)="delete()" #deleteAlert>
</swal>
<div class="row mt-3">
    <div class="col-12">
        <app-list-view [trackByProp]="'deviceId'"
                       [clientSide]="true"
                       [rowsPerPage]="10"
                       [canFilter]="false"
                       [columns]="columns"
                       [rows]="rows"
                       [defaultSortField]="'dateCreated'"
                       [defaultSortDirection]="'desc'"
                       #userDeviceList></app-list-view>
    </div>
</div>
<ng-template let-row="row" let-value="value" #actionsTemplate>
    <a class="icon-link text-primary" role="button" *ngIf="value && canEditUser" (click)="showDeleteAlert(value)" title="Delete">
        <i class="material-icons align-middle text-danger">delete</i>
    </a>
</ng-template>
