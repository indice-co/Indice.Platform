<lib-view-layout [title]="'accessRules.create.title' | translate" [busy]="busy">
  <main class="details-view-container">
    <div class="bg-white shadow-sm rounded-sm w-full p-4">
      <form #form="ngForm" (ngSubmit)="form.valid && submit()" class="space-y-4 max-w-2xl">
        <div>
          <label class="block text-sm font-medium text-gray-700" for="targetType">{{ 'accessRules.column.target' | translate }} *</label>
          <select id="targetType" name="targetType" class="form-select w-full" [(ngModel)]="targetType" (ngModelChange)="targetId = undefined">
            <option value="caseType">{{ 'accessRules.target.caseType' | translate }}</option>
            <option value="checkpointType">{{ 'accessRules.target.checkpointType' | translate }}</option>
          </select>
        </div>
        <div>
          <select id="targetId" name="targetId" class="form-select w-full" required [(ngModel)]="targetId">
            @if (targetType === 'caseType') {
              @for (caseType of caseTypes; track caseType.id) {
                <option [ngValue]="caseType.id">{{ caseType.title }} ({{ caseType.code }})</option>
              }
            } @else {
              @for (checkpointType of checkpointTypes; track checkpointType.id) {
                <option [ngValue]="checkpointType.id">{{ checkpointType.caseTypeCode }} / {{ checkpointType.code }}</option>
              }
            }
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700" for="memberType">{{ 'accessRules.column.member' | translate }} *</label>
          <select id="memberType" name="memberType" class="form-select w-full" [(ngModel)]="memberType">
            <option value="role">{{ 'accessRules.column.role' | translate }}</option>
            <option value="group">{{ 'accessRules.column.group' | translate }}</option>
            <option value="user">{{ 'accessRules.column.user' | translate }}</option>
          </select>
        </div>
        <div>
          <input id="memberValue" name="memberValue" type="text" class="form-input w-full" required [(ngModel)]="memberValue" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700" for="accessLevel">{{ 'accessRules.column.accessLevel' | translate }} *</label>
          <select id="accessLevel" name="accessLevel" class="form-select w-full" [(ngModel)]="accessLevel">
            @for (level of levels; track level.value) {
              <option [ngValue]="level.value">{{ level.label | translate }}</option>
            }
          </select>
        </div>
        <div class="flex gap-2">
          <button type="submit" class="btn-submit" [disabled]="busy || form.invalid">{{ 'common.save' | translate }}</button>
          <button type="button" class="btn-return" (click)="goBack()">{{ 'common.return' | translate }}</button>
        </div>
      </form>
    </div>
  </main>
</lib-view-layout>
