<div class="p-5">
  <hr class="mb-3">
  <div class="col-span-4">
    <h3 class="text-lg leading-6 font-medium text-gray-900 mb-2">
      {{action?.name}}
    </h3>
  </div>
  @if (action?.description) {
    <div>
      <label for="comment-textarea"
      class="field-label"> {{action?.description}}</label>
      @if (action?.hasInput) {
        <div class="my-2 flex rounded-sm"
          >
          <input type="text"
            [(ngModel)]="value">
          </div>
        }
      </div>
    }
    <div>
      <button href="#"
        [class]="'mr-1 ' + class"
        [title]="'common.execute' | translate"
        [disabled]="buttonDisabled"
        [ngClass]="{'opacity-50 cursor-not-allowed': buttonDisabled}"
        (click)="triggerAction()">
        <p>{{action?.label}}</p>&nbsp;
      </button>
    </div>
  </div>
