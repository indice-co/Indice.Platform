<div class="flex h-full bg-base-200">
  <!-- Palette -->
  <div class="hidden w-56 shrink-0 lg:block">
    <app-flow-palette (add)="addNode($event)" />
  </div>

  <!-- Canvas column -->
  <div class="flex min-w-0 flex-1 flex-col">
    <!-- Toolbar -->
    <div
      class="flex h-14 shrink-0 items-center justify-between gap-3 border-b border-base-300
             bg-base-100 px-4"
    >
      <div class="min-w-0">
        <h1 class="flex items-center gap-2 text-sm font-semibold text-base-content">
          RAG flow
          <span class="badge badge-ghost badge-xs border-base-300 font-mono uppercase tracking-wide">
            demo
          </span>
        </h1>
        <p class="font-mono text-[0.62rem] text-base-content/45">
          {{ nodes().length }} nodes · {{ edges().length }} connections
        </p>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" class="btn btn-ghost btn-sm gap-1.5" (click)="resetSample()">
          <svg viewBox="0 0 24 24" fill="none" class="size-4" aria-hidden="true">
            <path
              d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Reset
        </button>

        <button type="button" class="btn btn-primary btn-sm gap-1.5" (click)="simulateRun()">
          @if (running()) {
            <svg viewBox="0 0 24 24" fill="none" class="size-4" aria-hidden="true">
              <rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor" />
            </svg>
            Stop
          } @else {
            <svg viewBox="0 0 24 24" fill="none" class="size-4" aria-hidden="true">
              <path d="M7 5v14l12-7z" fill="currentColor" />
            </svg>
            Simulate run
          }
        </button>
      </div>
    </div>

    <!-- Canvas -->
    <div class="relative min-h-0 flex-1">
      <app-flow-canvas
        [nodes]="nodes()"
        [edges]="edges()"
        [selectedId]="selectedId()"
        [activeId]="activeId()"
        [pending]="pending()"
        (select)="selectNode($event)"
        (backgroundClick)="deselect()"
        (move)="moveNode($event)"
        (connect)="connect($event)"
        (removeEdge)="removeEdge($event)"
        (pendingChange)="pending.set($event)"
      />

      <!-- Hint legend -->
      <div
        class="pointer-events-none absolute bottom-3 left-3 hidden items-center gap-3 rounded-full
               border border-base-300 bg-base-100/85 px-3.5 py-1.5 font-mono text-[0.62rem]
               text-base-content/50 shadow-sm backdrop-blur sm:flex"
      >
        <span>drag to move</span>
        <span class="text-base-content/25">·</span>
        <span>pull a port to connect</span>
        <span class="text-base-content/25">·</span>
        <span>click a line to remove</span>
      </div>

      <!-- Empty state -->
      @if (nodes().length === 0) {
        <div class="pointer-events-none absolute inset-0 grid place-items-center px-6 text-center">
          <div class="pointer-events-auto">
            <p class="text-sm text-base-content/55">Canvas is empty.</p>
            <button type="button" class="btn btn-primary btn-sm mt-3" (click)="resetSample()">
              Load sample flow
            </button>
          </div>
        </div>
      }
    </div>
  </div>

  <!-- Inspector -->
  @if (selectedNode(); as n) {
    <div class="hidden w-72 shrink-0 lg:block">
      <app-flow-inspector
        [node]="n"
        (titleChange)="updateTitle($event)"
        (configChange)="updateConfig($event)"
        (remove)="removeNode($event)"
      />
    </div>
  }
</div>
