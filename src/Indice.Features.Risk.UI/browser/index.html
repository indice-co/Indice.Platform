<!doctype html>
<html lang="%(Lang)" data-theme="risk">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>%(DocumentTitle)</title>
    <base href="%(Path)/" />
    <link rel="icon" type="image/svg+xml" href="%(Path)/favicon.svg" />
    <link rel="stylesheet" href="%(Path)/styles-*.css" />
    %(HeadContent)
</head>
<body>
    <app-root host="%(Host)"
              authority="%(Authority)"
              clientId="%(ClientId)"
              baseHref="%(Path)"
              culture="%(Culture)"
              version="%(ProductVersion)"
              scopes="%(Scopes)"
              apiUrl="%(ApiUrl)">
    </app-root>
    <link rel="modulepreload" href="%(Path)/chunk-*.js">
    <script src="%(Path)/polyfills-*.js" type="module"></script>
    <script src="%(Path)/main-*.js" type="module"></script>
</body>
</html>
