<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <!-- Ocean: deep navy with cobalt, cyan and indigo light under topographic wave lines. Panel theme hero artwork. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1b4d"/>
      <stop offset=".55" stop-color="#0c2363"/>
      <stop offset="1" stop-color="#071236"/>
    </linearGradient>
    <radialGradient id="blue">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".85"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".65"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigo">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1200" fill="url(#base)"/>
  <ellipse cx="300" cy="220" rx="720" ry="520" fill="url(#blue)"/>
  <ellipse cx="1300" cy="980" rx="720" ry="500" fill="url(#cyan)"/>
  <ellipse cx="1260" cy="240" rx="520" ry="380" fill="url(#indigo)"/>

