    <path d="M-60 260 C 220 200 440 340 720 280 S 1200 160 1660 250" stroke-opacity=".12" stroke-width="1.5"/>
    <path d="M-60 340 C 230 280 460 420 740 360 S 1220 240 1660 330" stroke-opacity=".14" stroke-width="1.5"/>
    <path d="M-60 420 C 240 360 480 500 760 440 S 1240 320 1660 410" stroke-opacity=".16" stroke-width="1.5"/>
    <path d="M-60 500 C 250 440 500 580 780 520 S 1260 400 1660 490" stroke-opacity=".18" stroke-width="1.5"/>
    <path d="M-60 580 C 260 520 520 660 800 600 S 1280 480 1660 570" stroke-opacity=".2" stroke-width="1.5"/>
    <path d="M-60 660 C 270 600 540 740 820 680 S 1300 560 1660 650" stroke-opacity=".18" stroke-width="1.5"/>
    <path d="M-60 740 C 280 680 560 820 840 760 S 1320 640 1660 730" stroke-opacity=".16" stroke-width="1.5"/>
    <path d="M-60 820 C 290 760 580 900 860 840 S 1340 720 1660 810" stroke-opacity=".14" stroke-width="1.5"/>
    <path d="M-60 900 C 300 840 600 980 880 920 S 1360 800 1660 890" stroke-opacity=".12" stroke-width="1.5"/>
