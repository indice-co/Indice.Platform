    <path d="M-60 1060 C 320 1000 640 1140 920 1080 S 1400 960 1660 1050" stroke-opacity=".08" stroke-width="1.5"/>
  </g>

  <g fill="none" stroke="#67e8f9" stroke-linecap="round">
    <path d="M-60 580 C 260 520 520 660 800 600 S 1280 480 1660 570" stroke-width="90" stroke-opacity=".05"/>
    <path d="M-60 580 C 260 520 520 660 800 600 S 1280 480 1660 570" stroke-width="3" stroke-opacity=".35"/>
