<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Aurora: northern lights over a midnight sky. Default hero artwork (split theme). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset=".6" stop-color="#130d33"/>
      <stop offset="1" stop-color="#0a0a1f"/>
    </linearGradient>
    <radialGradient id="violet">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#6d28d9" stop-opacity=".35"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#0891b2" stop-opacity=".25"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint">
      <stop offset="0" stop-color="#34d399" stop-opacity=".5"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magenta">
      <stop offset="0" stop-color="#db2777" stop-opacity=".6"/>
      <stop offset=".6" stop-color="#be185d" stop-opacity=".2"/>
      <stop offset="1" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon-a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset=".35" stop-color="#34d399"/>
      <stop offset=".65" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbon-b" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".4" stop-color="#a78bfa"/>
      <stop offset=".8" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <ellipse cx="260" cy="160" rx="760" ry="520" fill="url(#violet)"/>
  <ellipse cx="1380" cy="220" rx="640" ry="460" fill="url(#cyan)"/>
  <ellipse cx="1120" cy="900" rx="760" ry="420" fill="url(#magenta)"/>
  <ellipse cx="900" cy="470" rx="520" ry="260" fill="url(#mint)"/>

  <g fill="none" stroke-linecap="round">
    <g stroke="url(#ribbon-a)">
      <path d="M-120 560 C 260 380 560 700 940 470 S 1460 220 1720 330" stroke-width="260" stroke-opacity=".05"/>
      <path d="M-120 560 C 260 380 560 700 940 470 S 1460 220 1720 330" stroke-width="160" stroke-opacity=".07"/>
      <path d="M-120 560 C 260 380 560 700 940 470 S 1460 220 1720 330" stroke-width="80" stroke-opacity=".1"/>
      <path d="M-120 560 C 260 380 560 700 940 470 S 1460 220 1720 330" stroke-width="24" stroke-opacity=".18"/>
    </g>
    <g stroke="url(#ribbon-b)">
      <path d="M-120 380 C 220 250 620 420 980 260 S 1500 90 1720 160" stroke-width="200" stroke-opacity=".04"/>
      <path d="M-120 380 C 220 250 620 420 980 260 S 1500 90 1720 160" stroke-width="110" stroke-opacity=".06"/>
      <path d="M-120 380 C 220 250 620 420 980 260 S 1500 90 1720 160" stroke-width="40" stroke-opacity=".1"/>
      <path d="M-120 380 C 220 250 620 420 980 260 S 1500 90 1720 160" stroke-width="10" stroke-opacity=".16"/>
    </g>
  </g>

  <g fill="#ffffff">
    <circle cx="180" cy="90" r="1.6" opacity=".7"/>
    <circle cx="420" cy="60" r="1.2" opacity=".5"/>
    <circle cx="640" cy="130" r="1.8" opacity=".6"/>
    <circle cx="860" cy="70" r="1.1" opacity=".5"/>
    <circle cx="1040" cy="150" r="1.5" opacity=".6"/>
    <circle cx="1240" cy="80" r="1.3" opacity=".7"/>
    <circle cx="1460" cy="120" r="1.7" opacity=".5"/>
    <circle cx="1530" cy="40" r="1.1" opacity=".6"/>
    <circle cx="90" cy="300" r="1.2" opacity=".4"/>
    <circle cx="1500" cy="420" r="1.3" opacity=".4"/>
    <circle cx="760" cy="40" r="1" opacity=".6"/>
    <circle cx="330" cy="230" r="1" opacity=".5"/>
  </g>

  <path d="M0 860 C 220 820 420 880 640 850 S 1060 780 1280 830 S 1520 860 1600 840 V1000 H0 Z" fill="#070a1a" opacity=".75"/>
  <path d="M0 920 C 260 890 520 950 820 920 S 1360 880 1600 920 V1000 H0 Z" fill="#05060f" opacity=".85"/>
</svg>
