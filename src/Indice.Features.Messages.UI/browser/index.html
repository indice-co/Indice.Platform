<!doctype html>
<html lang="en" data-theme="messages">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>%(DocumentTitle) </title>
    <base href="%(Path)/" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="%(Path)/favicon.ico" />
    <link rel="stylesheet" href="styles-*.css" />
    %(HeadContent)
</head>
    <body class="fixed-left fixed-left-void">
        <app-root host="%(Host)"
                  authority="%(Authority)"
                  clientId="%(ClientId)"
                  Path="%(Path)"
                  BasePath="%(Path)"
                  culture="%(Culture)"
                  version="%(ProductVersion)"
                  scopes="%(Scopes)"
                  tenantId="%(TenantId)"
                  api="%(ApiBase)"
                  enableMediaLibrary="%(EnableMediaLibrary)"
                  maxFileSize="%(MaxFileSize)"
                  acceptableFileExtensions="%(AcceptableFileExtensions)">
        </app-root>

        <link rel="modulepreload" href="%(Path)/chunk-*.js">
        <script src="%(Path)/polyfills-*.js" type="module"></script>
        <script src="%(Path)/main-*.js" type="module"></script>
    </body>
</html>
