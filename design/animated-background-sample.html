<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated gradient background demo</title>
<style>
  :root {
    --c-blue:   #2f7cf6;
    --c-indigo: #4b5df2;
    --c-violet: #8a4bd8;
    --c-pink:   #d24da8;
    --c-orange: #f28c3a;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  /* ---------- Background ---------- */
  .auth-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background: linear-gradient(115deg,
        var(--c-blue) 0%, var(--c-indigo) 35%, var(--c-violet) 60%, var(--c-pink) 85%, var(--c-orange) 100%);
    background-size: 200% 200%;
    animation: hueShift 30s ease-in-out infinite alternate;
  }
  @keyframes hueShift { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }

  /* Soft glowing blobs */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .8;
    mix-blend-mode: screen;
    will-change: transform;
    animation: drift var(--dur, 20s) ease-in-out infinite alternate;
  }
  .blob-1 { width: 60vw; height: 60vw; top: -25vw; left: -15vw; background: #38b6ff; --dur: 22s; }
  .blob-2 { width: 55vw; height: 55vw; bottom: -20vw; left: 20vw; background: #b35cff; --dur: 26s; animation-delay: -8s; }
  .blob-3 { width: 50vw; height: 50vw; top: -15vw; right: -10vw; background: #ff8a3d; --dur: 18s; animation-delay: -4s; }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    33%  { transform: translate(8vw, -6vh) scale(1.1); }
    66%  { transform: translate(-6vw, 8vh) scale(.95); }
    100% { transform: translate(4vw, 4vh) scale(1.05); }
  }

  /* ---------- SVG waves ---------- */
  .waves {
    position: absolute;
    inset: -10%;             /* bleed so edges never show while moving */
    width: 120%;
    height: 120%;
  }
  .wave {
    transform-box: fill-box;
    transform-origin: center;
    will-change: transform;
    mix-blend-mode: screen;
  }
  .wave-1 { animation: wave1 26s ease-in-out infinite alternate; }
  .wave-2 { animation: wave2 32s ease-in-out infinite alternate; animation-delay: -10s; }
  .wave-3 { animation: wave3 38s ease-in-out infinite alternate; animation-delay: -18s; }
  .wave-4 { animation: wave1 44s ease-in-out infinite alternate-reverse; animation-delay: -6s; }

  @keyframes wave1 {
    from { transform: translate(0, 0) rotate(0deg) scale(1); }
    to   { transform: translate(4%, -3%) rotate(3deg) scale(1.06); }
  }
  @keyframes wave2 {
    from { transform: translate(0, 0) rotate(0deg); }
    to   { transform: translate(-5%, 4%) rotate(-4deg) scale(1.04); }
  }
  @keyframes wave3 {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(3%, 5%) rotate(2deg) scale(1.08); }
  }

  /* Film grain */
  .grain {
    position: absolute; inset: 0; opacity: .08; mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  @media (prefers-reduced-motion: reduce) { .auth-bg, .blob, .wave { animation: none; } }

  /* ---------- Layout & card ---------- */
  .page { min-height: 100%; display: grid; grid-template-columns: 1fr 1fr; align-items: center; padding: 2rem; gap: 2rem; }
  .hero { color: #fff; padding: 2rem; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
  .hero h1 { font-size: 2.25rem; font-weight: 500; margin: 0 0 .5rem; }
  .hero p  { font-size: 1.1rem; margin: 0; opacity: .9; }

  .card { background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.25); padding: 2.5rem; width: 100%; max-width: 380px; margin: 0 auto; }
  .card h2 { margin: 0 0 1.5rem; text-align: center; font-weight: 500; font-size: 1.25rem; }
  label { display: block; font-size: .8rem; color: #555; margin-bottom: .35rem; }
  input { width: 100%; padding: .7rem .8rem; border: 1px solid #d0d0d0; border-radius: 6px; font-size: .95rem; margin-bottom: 1rem; }
  input:focus { outline: 2px solid var(--c-indigo); border-color: transparent; }
  button { width: 100%; padding: .8rem; border: none; border-radius: 6px; background: #111; color: #fff; font-size: .95rem; cursor: pointer; }
  button:hover { background: #333; }
  .links { margin-top: 1.25rem; text-align: center; font-size: .8rem; color: #666; }
  .links a { color: var(--c-indigo); }
  @media (max-width: 800px) { .page { grid-template-columns: 1fr; } .hero { text-align: center; } }
</style>
</head>
<body>

  <div class="auth-bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>

    <svg class="waves" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0"   stop-color="#5b7bff" stop-opacity=".95"/>
          <stop offset=".55" stop-color="#a55cf0" stop-opacity=".9"/>
          <stop offset="1"   stop-color="#ff7ad9" stop-opacity=".85"/>
        </linearGradient>
        <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0"   stop-color="#c04ee6" stop-opacity=".9"/>
          <stop offset=".6"  stop-color="#ff6ab5" stop-opacity=".85"/>
          <stop offset="1"   stop-color="#ffb35c" stop-opacity=".8"/>
        </linearGradient>
        <linearGradient id="g3" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="#ffa25a" stop-opacity=".9"/>
          <stop offset=".5"  stop-color="#ff5f8f" stop-opacity=".8"/>
          <stop offset="1"   stop-color="#8c5cff" stop-opacity=".7"/>
        </linearGradient>
        <linearGradient id="g4" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"   stop-color="#3ec4ff" stop-opacity=".8"/>
          <stop offset="1"   stop-color="#6f6cff" stop-opacity=".6"/>
        </linearGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1"/>
        </filter>
        <filter id="softer" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="3"/>
        </filter>
      </defs>

      <!-- Large sweeping curve, bottom-left -> upper-right -->
      <path class="wave wave-1" fill="url(#g1)" filter="url(#soft)"
        d="M -200 900
           C 150 700, 350 420, 700 380
           S 1250 520, 1650 280
           L 1650 1000 L -200 1000 Z"/>

      <!-- Mid ribbon crossing diagonally -->
      <path class="wave wave-2" fill="url(#g2)" filter="url(#soft)"
        d="M -200 620
           C 200 560, 420 780, 760 700
           S 1200 380, 1650 460
           C 1500 620, 1250 700, 950 860
           S 250 980, -200 900 Z"/>

      <!-- Warm accent from top-right -->
      <path class="wave wave-3" fill="url(#g3)" filter="url(#softer)"
        d="M 700 -100
           C 950 60, 1050 260, 1300 300
           S 1650 240, 1650 240
           L 1650 -100 Z"/>

      <!-- Cool highlight band -->
      <path class="wave wave-4" fill="url(#g4)" filter="url(#softer)"
        d="M -200 300
           C 150 220, 300 420, 600 380
           S 1000 180, 1250 260
           C 1050 380, 800 520, 500 560
           S 50 500, -200 560 Z"/>
    </svg>

    <span class="grain"></span>
  </div>

  <main class="page">
    <section class="hero">
      <h1>Η ταυτότητά σου, στα χέρια σου.</h1>
      <p>Απόκτησε πρόσβαση στον κόσμο σου με σιγουριά.</p>
    </section>

    <form class="card" onsubmit="event.preventDefault(); alert('Submitted');">
      <h2>Είσοδος στο λογαριασμό</h2>
      <label for="email">Όνομα χρήστη</label>
      <input id="email" type="email" placeholder="myemail@mycompany.gr" autocomplete="username">
      <label for="password">Κωδικός πρόσβασης</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      <button type="submit">Είσοδος</button>
      <div class="links">Δεν έχεις λογαριασμό; <a href="#">Δημιουργία λογαριασμού</a></div>
    </form>
  </main>

</body>
</html>
