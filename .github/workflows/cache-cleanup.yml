name: "Github Cache Cleanup"

permissions:
  contents: read

# Github cache cleanup schedule, every day at 23:59 (except Saturday & Sunday)
# on:
#   schedule:
#     - cron: "59 23 * * 1-5"

on:
  workflow_dispatch:

jobs:
  cache-cleanup:
    name: Github Cache Cleanup
    runs-on: ubuntu-latest
    steps:
    - name: Github Cache Cleanup
      run: |
        gh cache list
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
