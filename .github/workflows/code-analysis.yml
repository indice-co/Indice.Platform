name: Pull Request Automation

on:
  pull_request:

jobs:
  run-build:
    name: .NET Build
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # - name: Get changed files
      #   id: changed-files
      #   shell: pwsh
      #   run: |
      #     $files = gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path'
      #     $extensions = $files -match '\.(\w+)$' | ForEach-Object { ($_ -split '\.')[-1] } | Sort-Object -Unique
      #     $extensionString = $extensions -join ' '
      #     echo "extensions=$extensionString" | Out-File -FilePath $env:GITHUB_ENV -Append
      #   env:
      #     GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dotnet build
        id: dotnet-build
        uses: ./.github/workflows/composites/build-action
        with:
          dotnetCacheKey: dotnet-build-${{ github.sha }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}

  run-dotnet-tests:
    needs: [run-build]
    name: .NET Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dotnet test
        id: dotnet-test
        uses: ./.github/workflows/composites/test-action
        with:
          dotnetCacheKey: dotnet-build-${{ github.sha }}

  run-code-analysis:
    needs: [run-build]
    uses: ./.github/workflows/codeql.yml
    secrets: inherit