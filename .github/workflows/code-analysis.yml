name: Pull Request Automation

on:
  pull_request:

jobs:
  run-build:
    name: .NET Build
    runs-on: windows-latest
    outputs:
      changedFileExtensions: ${{ steps.changedFiles.outputs.extensions }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get changed files
        id: changedFiles
        shell: pwsh
        run: |
          $files = gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path'
          $extensions = $files -match '\.(\w+)$' | ForEach-Object { ($_ -split '\.')[-1] } | Sort-Object -Unique
          $extensionString = $extensions -join ' '
          echo "extensions=$extensionString" | Out-File -FilePath $env:GITHUB_ENV -Append
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test echo
        id: testEcho
        shell: pwsh
        run: |
          Write-Output "Changed file extensions: $env:extensions"
          

