name: Pull Request Automation

on:
  pull_request:

jobs:
  run-build:
    name: .NET Build
    runs-on: windows-latest
    outputs:
      dotnetFilesChanged: ${{ steps.changedFiles.outputs.dotnetFilesChanged }}
      javascriptFilesChanged: ${{ steps.changedFiles.outputs.javascriptFilesChanged }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get changed files
        id: changedFiles
        shell: pwsh
        run: |
          $files = gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path'
          $extensions = $files -match '\.(\w+)$' | ForEach-Object { ($_ -split '\.')[-1].ToLower() } | Sort-Object -Unique
          $dotnetExts = @('sln', 'csproj', 'cs', 'props')
          $jsExts = @('js', 'ts', 'css', 'html')
          $dotnetFiles = ($extensions | Where-Object { $dotnetExts -contains $_ }) ? 'true' : 'false'
          $jsFiles = ($extensions | Where-Object { $jsExts -contains $_ }) ? 'true' : 'false'
          echo "dotnetFilesChanged=$dotnetFiles" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "javascriptFilesChanged=$jsFiles" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "::set-output name=dotnetFilesChanged::$dotnetFiles"
          echo "::set-output name=javascriptFilesChanged::$jsFiles"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-env:
    runs-on: windows-latest
    needs: [run-build]
    steps:
      - name: Test echo
        id: testEcho
        shell: pwsh
        run: |
          echo "dotnetFilesChanged: ${{ needs.run-build.outputs.dotnetFilesChanged }}"
          echo "javascriptFilesChanged: ${{ needs.run-build.outputs.javascriptFilesChanged }}"

