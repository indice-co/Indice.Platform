name: Pull Request Automation

on:
  pull_request:

jobs:
  run-build:
    name: .NET Build
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get changed files
        id: changed-files
        shell: pwsh
        run: |
          $files = gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path'
          $extensions = $files -match '\.(\w+)$' | ForEach-Object { ($_ -split '\.')[-1] } | Sort-Object -Unique
          $extensionString = $extensions -join ' '
          echo "extensions=$extensionString" | Out-File -FilePath $env:GITHUB_ENV -Append
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Conditional Step (if .cs files changed)
        if: contains(env.extensions, 'sln') || contains(env.extensions, 'csproj') || contains(env.extensions, 'cs') || contains(env.extensions, 'props')
        shell: pwsh
        run: |
          echo "Build dotnet"

      - name: Conditional Step (if .cs files changed)
        if: contains(env.extensions, 'ts') || contains(env.extensions, 'js')
        shell: pwsh
        run: |
          echo "Build TS"

