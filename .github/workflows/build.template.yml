name: Build process

on:
  workflow_call:
    secrets:
      NUGET_AUTH_TOKEN:
        required: true

permissions:  
  contents: read

jobs:
  run-build:
    runs-on: windows-latest
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
      with:
        egress-policy: audit

    - name: Checkout Repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.2.3
      with:
        global-json-file: ./global.json
        source-url: https://api.nuget.org/v3/index.json
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}

    - name: Use Node.js 24.x
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: 24

    - name: Create .nuget dir
      shell: pwsh
      run: |
        if (!(Test-Path -Path ".\.nuget" )) {
          New-Item -ItemType "directory" -Path ".\.nuget"
        }
        if (!(Test-Path -Path ".\.nuget\packages" )) {
          New-Item -ItemType "directory" -Path ".\.nuget\packages"
        }
                
    - name: dotnet restore
      shell: pwsh
      run: dotnet restore Indice.Platform.slnx

    - name: dotnet build SPAs
      shell: pwsh
      run: dotnet build Indice.Platform.Ecmascript.slnf --no-restore --configuration Release

    - name: dotnet build
      shell: pwsh
      run: dotnet build Indice.Platform.slnf --no-restore --configuration Release
    
    - name: dotnet test
      shell: pwsh
      run: dotnet test Indice.Platform.slnf --no-build --configuration Release --logger trx --results-directory "TestResults"
    
    - name: Test Reporter
      uses: dorny/test-reporter@890a17cecf52a379fc869ab770a71657660be727 # v2.1.0
      if: always()
      with:
        name: DotNET Tests
        path: "TestResults/*.trx"                            
        reporter: dotnet-trx
        fail-on-error: true
