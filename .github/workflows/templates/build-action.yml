name: Build process

on:
  workflow_call:

jobs:
  run-build:
    steps:

    - name: Harden Runner
      uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
      with:
        egress-policy: audit

    - name: Checkout Repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.2.3
      with:
        dotnet-version: 8.x
        source-url: https://api.nuget.org/v3/index.json

    - name: Use Node.js 20.x
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: 20

    - name: Create .nuget dir
      shell: pwsh
      run: |
        if (!(Test-Path -Path ".\.nuget" )) {
          New-Item -ItemType "directory" -Path ".\.nuget"
        }
        if (!(Test-Path -Path ".\.nuget\packages" )) {
          New-Item -ItemType "directory" -Path ".\.nuget\packages"
        }
                
    - name: Dotnet restore
      shell: pwsh
      run: dotnet restore Indice.Platform.slnx /nowarn:netsdk1138

    - name: Dotnet build SPAs
      shell: pwsh
      run: dotnet build Indice.Platform.Ecmascript.slnf --no-restore --configuration Release

    - name: Dotnet build
      shell: pwsh
      run: dotnet build Indice.Platform.slnf --no-restore --configuration Release

    - name: Cache dotnet output
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          ~/.nuget/packages
          **/bin
          **/obj
        key: dotnet-build-${{ github.sha }}