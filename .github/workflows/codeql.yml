name: Branch protection

on:
  pull_request:
  push:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-build:
    name: .NET Build
    if: always()
    runs-on: windows-latest
    uses: ./.github/workflows/templates/build-action.yml
    permissions:
      contents: read
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}

  run-dotnet-tests:
    needs: [run-build]
    if: always()
    name: .NET Tests
    runs-on: windows-latest
    uses: ./.github/workflows/templates/test-action.yml
    permissions:
      contents: read
      actions: read
      checks: write

  run-codeql-csharp:
    if: always()
    needs: [run-build]
    name: CodeQL (C#)
    runs-on: windows-latest
    uses: ./.github/workflows/templates/codeql-cs-action.yml
    permissions:
      contents: read
      security-events: write
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}

  run-codeql-javascript:
    if: always()
    needs: [run-build]
    name: CodeQL (JavaScript)
    runs-on: windows-latest
    uses: ./.github/workflows/templates/codeql-js-action.yml
    permissions:
      contents: read
      security-events: write
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
        
        