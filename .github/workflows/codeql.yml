name: Branch protection

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-build:
    name: .NET Build
    if: always()
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dotnet build
        id: dotnet-build
        uses: ./.github/workflows/composites/build-action
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}

      - name: Cache dotnet output
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.nuget/packages
            **/bin
            **/obj
          key: dotnet-build-${{ github.sha }}

  run-dotnet-tests:
    needs: [run-build]
    if: always()
    name: .NET Tests
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore Cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.nuget/packages
            **/bin
            **/obj
          key: dotnet-build-${{ github.sha }}

      - name: Dotnet test
        id: dotnet-test
        uses: ./.github/workflows/composites/test-action

  run-codeql-csharp:
    if: always()
    needs: [run-build]
    name: CodeQL (C#)
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore Cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.nuget/packages
            **/bin
            **/obj
          key: dotnet-build-${{ github.sha }}

      - name: CodeQL (C#)
        id: codeql-csharp
        uses: ./.github/workflows/composites/codeql-csharp
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}

  run-codeql-javascript:
    if: always()
    needs: [run-build]
    name: CodeQL (JavaScript)
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Restore Cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.nuget/packages
            **/bin
            **/obj
          key: dotnet-build-${{ github.sha }}

      - name: CodeQL (JavaScript)
        id: codeql-js
        uses: ./.github/workflows/composites/codeql-js
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
        