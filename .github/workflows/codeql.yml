name: Branch protection

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ develop ]

jobs:
  run-build:
    name: .NET Build
    if: always()
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Import GPG Key
        run: |
          echo "test content" >> test-file.txt
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --passphrase-fd 0 --batch --pinentry-mode loopback --preset-passphrase ${{ secrets.GPG_KEY_ID }}
          gpg --detach-sign --armor --batch --yes --passphrase "${{ secrets.GPG_PASSPHRASE }}" --local-user ${{ secrets.GPG_KEY_ID }} test-file.txt

