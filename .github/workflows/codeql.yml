name: Branch protection

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-build:
    name: .NET build and test
    if: always()
    uses: ./.github/workflows/build.template.yml
    secrets:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
    permissions:
      contents: read
      actions: read
      checks: write

  run-codeql-csharp:
    if: always()
    name: CodeQL (C#)
    uses: ./.github/workflows/codeql-cs.template.yml
    secrets:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
    permissions:
      contents: read
      security-events: write
    
  run-codeql-javascript:
    if: always()
    name: CodeQL (JavaScript)
    uses: ./.github/workflows/codeql-js.template.yml
    permissions:
      contents: read
      security-events: write