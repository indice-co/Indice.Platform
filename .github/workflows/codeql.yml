name: Branch protection

on:
  pull_request:
  push:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run-build:
    name: .NET Build
    if: always()
    uses: ./.github/workflows/build.template.yml
    secrets:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
    permissions:
      contents: read

  run-dotnet-tests:
    needs: [run-build]
    if: always()
    name: .NET Tests
    uses: ./.github/workflows/test.template.yml
    permissions:
      contents: read
      actions: read
      checks: write

  run-codeql-csharp:
    if: always()
    needs: [run-build]
    name: CodeQL (C#)
    uses: ./.github/workflows/codeql-cs.template.yml
    secrets:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
    permissions:
      contents: read
      security-events: write
    
  run-codeql-javascript:
    if: always()
    needs: [run-build]
    name: CodeQL (JavaScript)
    uses: ./.github/workflows/codeql-js.template.yml
    permissions:
      contents: read
      security-events: write