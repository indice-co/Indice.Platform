name: Branch protection

on:
  push:

jobs:
  get-changed-files:
    name: Check changed files
    runs-on: windows-latest
    outputs:
      dotnetFilesChanged: ${{ steps.changedFiles.outputs.dotnetFilesChanged }}
      javascriptFilesChanged: ${{ steps.changedFiles.outputs.javascriptFilesChanged }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get changed files
        id: changedFiles
        shell: pwsh
        run: |
          # $files = gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path'
          # $extensions = $files -match '\.(\w+)$' | ForEach-Object { ($_ -split '\.')[-1].ToLower() } | Sort-Object -Unique
          # $dotnetExts = @('sln', 'csproj', 'cs', 'props')
          # $jsExts = @('js', 'ts', 'css', 'html')
          # $dotnetFiles = ($extensions | Where-Object { $dotnetExts -contains $_ }) ? 'true' : 'false'
          # $jsFiles = ($extensions | Where-Object { $jsExts -contains $_ }) ? 'true' : 'false'
          # echo "dotnetFilesChanged=$dotnetFiles" | Out-File -FilePath $env:GITHUB_ENV -Append
          # echo "javascriptFilesChanged=$jsFiles" | Out-File -FilePath $env:GITHUB_ENV -Append
          # echo "dotnetFilesChanged=$dotnetFiles" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # echo "javascriptFilesChanged=$jsFiles" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-build:
    name: .NET Build
    if: needs.get-changed-files.outputs.dotnetFilesChanged == 'true'
    runs-on: windows-latest
    needs: [get-changed-files]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dotnet build
        id: dotnet-build
        uses: ./.github/workflows/composites/build-action
        with:
          dotnetCacheKey: dotnet-build-${{ github.sha }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}

  run-dotnet-tests:
    needs: [get-changed-files, run-build]
    if: needs.get-changed-files.outputs.dotnetFilesChanged == 'true'
    name: .NET Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dotnet test
        id: dotnet-test
        uses: ./.github/workflows/composites/test-action
        with:
          dotnetCacheKey: dotnet-build-${{ github.sha }}

  run-codeql-csharp:
    if: needs.get-changed-files.outputs.dotnetFilesChanged == 'true'
    needs: [get-changed-files, run-build]
    name: CodeQL (C#)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: CodeQL (C#)
        id: codeql-csharp
        uses: ./.github/workflows/composites/codeql-csharp
        with:
          dotnetCacheKey: dotnet-build-${{ github.sha }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}

  run-codeql-javascript:
    if: needs.get-changed-files.outputs.javascriptFilesChanged == 'true'
    needs: [get-changed-files, run-build]
    name: CodeQL (JavaScript)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: CodeQL (JavaScript)
        id: codeql-js
        uses: ./.github/workflows/composites/codeql-js
        with:
          dotnetCacheKey: dotnet-build-${{ github.sha }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}

  run-codeql-mock:
    needs: [get-changed-files]
    name: CodeQL (Mock)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3.28.9
        with:
          languages: ''
          config-file: ./.github/workflows/codeql/codeql-config.yml
        
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3.28.9