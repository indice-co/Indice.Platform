name: Build process
description: Composite action for executing dotnet build

inputs:
  dotnetCacheKey:
    type: string
    required: true

runs:
  using: 'composite'
  steps:
    - name: Harden Runner
      uses: step-security/harden-runner@c95a14d0e5bab51a9f56296a4eb0e416910cd350 # v2.10.3
      with:
        egress-policy: audit

    - name: Setup .NET
      uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
      with:
        dotnet-version: 8.x
        source-url: https://api.nuget.org/v3/index.json

    - name: Use Node.js 20.x
      uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
      with:
        node-version: 20
     
    - name: Create .nuget dir
      shell: pwsh
      run: |
        if (!(Test-Path -Path ".\.nuget" )) {
          New-Item -ItemType "directory" -Path ".\.nuget"
        }
        if (!(Test-Path -Path ".\.nuget\packages" )) {
          New-Item -ItemType "directory" -Path ".\.nuget\packages"
        }
                
    - name: Dotnet restore
      shell: pwsh
      run: dotnet restore Indice.Platform.sln /nowarn:netsdk1138

    - name: Dotnet build SPAs
      shell: pwsh
      run: dotnet build Indice.Platform.Ecmascript.slnf --no-restore --configuration Release

    - name: Dotnet build
      shell: pwsh
      run: dotnet build Indice.Platform.slnf --no-restore --configuration Release

    - name: Cache dotnet output
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          ~/.nuget/packages
          **/bin
          **/obj
        key: ${{ inputs.dotnetCacheKey }}