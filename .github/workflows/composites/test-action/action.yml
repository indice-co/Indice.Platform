name: Test process
description: Composite action for executing dotnet test

inputs:
  dotnetCacheKey:
    type: string
    required: true

runs:
  using: 'composite'
  steps:

    - name: Harden Runner
      uses: step-security/harden-runner@c95a14d0e5bab51a9f56296a4eb0e416910cd350 # v2.10.3
      with:
        egress-policy: audit

    - name: Restore Cache
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          ~/.nuget/packages
          **/bin
          **/obj
        key: ${{ inputs.dotnetCacheKey }}
  
    - name: Test with dotnet
      shell: pwsh
      run: dotnet test Indice.Platform.sln --no-build --configuration Release --logger trx --results-directory "TestResults"
    
    - name: Test Reporter
      uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
      if: always()
      with:
        name: DotNET Tests
        path: "TestResults/*.trx"                            
        reporter: dotnet-trx
        fail-on-error: true