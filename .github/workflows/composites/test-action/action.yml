name: Test process
description: Composite action for executing dotnet test

runs:
  using: 'composite'
  steps:

    - name: Harden Runner
      uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
      with:
        egress-policy: audit
  
    - name: Test with dotnet
      shell: pwsh
      run: dotnet test Indice.Platform.slnx --no-build --configuration Release --logger trx --results-directory "TestResults"
    
    - name: Test Reporter
      uses: dorny/test-reporter@890a17cecf52a379fc869ab770a71657660be727 # v2.1.0
      if: always()
      with:
        name: DotNET Tests
        path: "TestResults/*.trx"                            
        reporter: dotnet-trx
        fail-on-error: true